name: Android Debug Build

on:
  push:
    branches: [kilo/briny-crane-766, main]
  pull_request:
    branches: [kilo/briny-crane-766, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GODOT_VERSION: "4.4-stable"
  ANDROID_SDK_VERSION: "34"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
  ANDROID_NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"
  JAVA_VERSION: "17"

jobs:
  build-android-debug:
    name: Build Android Debug APK (4.4 Multi-Arch)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-${{ env.ANDROID_SDK_VERSION }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}" \
            "platform-tools"

      - name: Cache Godot, Export Templates, and Debug Keystore
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot/export_templates/4.4.stable
            debug.keystore
          key: godot-4.4.stable-fast-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            godot-4.4.stable-fast-

      - name: Create Debug Keystore (if missing)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storepass android \
              -keypass android
          else
            echo "Keystore already exists from cache, skipping creation"
          fi

      - name: Ensure Debug Keystore in ~/.android
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Download Godot Headless + Official Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/godot
          mkdir -p ~/.local/bin
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          cd ~/.cache/godot
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"
          echo "Downloading Godot headless from $GODOT_URL"
          wget -q "$GODOT_URL" -O godot.zip
          unzip -oq godot.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          ln -sf ~/.cache/godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 ~/.local/bin/godot
          TEMPLATES_URL="https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"
          echo "Downloading official export templates from $TEMPLATES_URL"
          wget -q "$TEMPLATES_URL" -O templates.tpz
          unzip -oq templates.tpz
          if [ -d "templates" ]; then
            mv templates/* .
            rmdir templates
          fi
          cp android_debug.apk ~/.local/share/godot/export_templates/4.4.stable/
          cp android_release.apk ~/.local/share/godot/export_templates/4.4.stable/
          ls -la ~/.local/share/godot/export_templates/4.4.stable/

      - name: Ensure Godot Symlink
        run: |
          mkdir -p ~/.local/bin
          ln -sf ~/.cache/godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 ~/.local/bin/godot

      - name: Verify Godot Installation
        run: |
          godot --version
          ls -la ~/.local/share/godot/export_templates/4.4.stable/

      - name: Inspect Official Template Architectures
        run: |
          echo "=== Debug Template ==="
          unzip -l ~/.local/share/godot/export_templates/4.4.stable/android_debug.apk | grep "lib/"
          echo "=== Release Template ==="
          unzip -l ~/.local/share/godot/export_templates/4.4.stable/android_release.apk | grep "lib/"

      - name: Export Android Debug APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/game.apk

      - name: Merge arm32 libs from template into exported APK
        run: |
          echo "Merging armeabi-v7a libs from template into exported APK..."
          cd build
          unzip -oq game.apk -d game_arm64
          unzip -oq ~/.local/share/godot/export_templates/4.4.stable/android_debug.apk -d template_debug
          mkdir -p game_arm64/lib/armeabi-v7a
          cp template_debug/lib/armeabi-v7a/libgodot_android.so game_arm64/lib/armeabi-v7a/
          cp template_debug/lib/armeabi-v7a/libc++_shared.so game_arm64/lib/armeabi-v7a/
          cd game_arm64
          zip -r0 ../game_unaligned.apk lib/
          zip -r9 ../game_unaligned.apk . -x "lib/*"
          cd ..
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f -p 4 game_unaligned.apk game_aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks ../debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out game.apk \
            game_aligned.apk
          rm -rf game_arm64 template_debug game_unaligned.apk game_aligned.apk
          echo "Merge complete - APK properly aligned and signed"

      - name: Fix AndroidManifest (remove adaptive icon refs)
        run: |
          chmod +x fix_manifest.sh
          ./fix_manifest.sh build/game.apk debug.keystore

      - name: Verify APK Architecture
        run: |
          echo "=== APK Info ==="
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging build/game.apk | grep -E "package|application|sdkVersion|targetSdkVersion|native-code|abi"
          echo ""
          echo "=== APK Size ==="
          ls -lh build/game.apk
          echo ""
          echo "=== Native Libraries ==="
          unzip -l build/game.apk | grep "lib/"

      - name: Verify APK Signature
        run: |
          echo "=== APK Signature Verification ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs build/game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-debug-apk
          path: build/game.apk
          retention-days: 7
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Godot Version:** ${{ env.GODOT_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Android SDK:** ${{ env.ANDROID_SDK_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**NDK:** ${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f build/game.apk ]; then
            echo "**APK Size:** $(ls -lh build/game.apk | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
            echo "**Architectures:** $($ANDROID_HOME/build-tools/34.0.0/aapt dump badging build/game.apk | grep native-code | sed 's/.*native-code: //' | tr -d "'")" >> $GITHUB_STEP_SUMMARY
            echo "**Native Libs:** $(unzip -l build/game.apk | grep 'lib/' | awk '{print $4}' | sort -u)" >> $GITHUB_STEP_SUMMARY
          fi