name: Android Debug Build

on:
  push:
    branches: [kilo/briny-crane-766, main]
  pull_request:
    branches: [kilo/briny-crane-766, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_CHANNEL: "stable"
  ANDROID_SDK_VERSION: "34"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
  ANDROID_NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"
  JAVA_VERSION: "17"
  SCONS_VERSION: "4.8.1"

jobs:
  build-android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-${{ env.ANDROID_SDK_VERSION }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}" \
            "platform-tools"

      - name: Install Python and SCons
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip pkg-config libssl-dev
          pip3 install scons==${{ env.SCONS_VERSION }}

      - name: Cache Godot Source and Export Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot/export_templates/4.7.2.stable
            godot-source
          key: godot-4.7.2.stable-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            godot-4.7.2.stable-

      - name: Download Godot Source and Headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/godot
          mkdir -p ~/.local/bin
          cd ~/.cache/godot
          
          # Download Godot headless binary
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"
          echo "Downloading Godot headless from $GODOT_URL"
          wget -q "$GODOT_URL" -O godot.zip
          unzip -oq godot.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          ln -sf ~/.cache/godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 ~/.local/bin/godot
          
          # Download Godot source code for building export templates
          cd /home/runner/work/Game-
          git clone --depth 1 --branch ${{ env.GODOT_VERSION }} https://github.com/godotengine/godot.git godot-source

      - name: Build Android Export Templates (arm64-v8a + armeabi-v7a)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          cd /home/runner/work/Game-/godot-source
          
          # Build arm64-v8a template
          echo "Building Android arm64-v8a export template..."
          scons platform=android arch=arm64 target=template_release -j$(nproc)
          scons platform=android arch=arm64 target=template_debug -j$(nproc)
          
          # Build armeabi-v7a template
          echo "Building Android armeabi-v7a export template..."
          scons platform=android arch=arm32 target=template_release -j$(nproc)
          scons platform=android arch=arm32 target=template_debug -j$(nproc)
          
          # Package templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp bin/godot.android.template_release.arm64 ~/.local/share/godot/export_templates/4.7.2.stable/android_release.apk
          cp bin/godot.android.template_debug.arm64 ~/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk
          
          # Note: Godot 4.x expects both architectures in the same APK
          # We need to merge them. The standard approach is to use the arm64 APK as base
          # and add arm32 libs to it. But Godot's export system handles this automatically
          # if both template APKs are present with correct naming.
          
          # Actually, Godot 4.x uses a single template APK per target (debug/release)
          # that contains BOTH architectures. We need to build a combined template.
          # The proper way is to build with both architectures in one go, but SCons doesn't support that directly.
          # Instead, we build the arm64 template, then manually add arm32 libs.
          
          # For now, let's use the arm64 template as base and inject arm32 libs
          # This is a workaround - the proper fix is multi-arch template building
          
          # Create a combined debug template
          cd ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -oq android_debug.apk -d android_debug_arm64
          unzip -oq /home/runner/work/Game-/godot-source/bin/godot.android.template_debug.arm32 -d android_debug_arm32
          
          # Merge arm32 libs into arm64 template
          cp -r android_debug_arm32/lib/armeabi-v7a android_debug_arm64/lib/
          
          # Repackage
          cd android_debug_arm64
          zip -r ../android_debug.apk .
          cd ..
          rm -rf android_debug_arm64 android_debug_arm32
          
          # Same for release
          unzip -oq android_release.apk -d android_release_arm64
          unzip -oq /home/runner/work/Game-/godot-source/bin/godot.android.template_release.arm32 -d android_release_arm32
          cp -r android_release_arm32/lib/armeabi-v7a android_release_arm64/lib/
          cd android_release_arm64
          zip -r ../android_release.apk .
          cd ..
          rm -rf android_release_arm64 android_release_arm32
          
          ls -la

      - name: Install Export Templates (from cache or build)
        if: steps.cache-godot.outputs.cache-hit == 'true'
        run: |
          ls -la ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Verify Godot Installation
        run: |
          godot --version
          ls -la ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android \
            -keypass android
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Export Android Debug APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/game.apk

      - name: Verify APK Architecture
        run: |
          echo "=== APK Info ==="
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging build/game.apk | grep -E "package|application|sdkVersion|targetSdkVersion|native-code|abi"
          echo ""
          echo "=== APK Size ==="
          ls -lh build/game.apk
          echo ""
          echo "=== Native Libraries ==="
          unzip -l build/game.apk | grep "lib/"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-debug-apk
          path: build/game.apk
          retention-days: 7
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Godot Version:** ${{ env.GODOT_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Android SDK:** ${{ env.ANDROID_SDK_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**NDK:** ${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f build/game.apk ]; then
            echo "**APK Size:** $(ls -lh build/game.apk | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
            echo "**Architectures:** $($ANDROID_HOME/build-tools/34.0.0/aapt dump badging build/game.apk | grep native-code | sed 's/.*native-code: //' | tr -d "'")" >> $GITHUB_STEP_SUMMARY
            echo "**Native Libs:** $(unzip -l build/game.apk | grep 'lib/' | awk '{print $4}' | sort -u)" >> $GITHUB_STEP_SUMMARY
          fi